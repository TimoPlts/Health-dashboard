<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Baseline POC</title>
  <style>
    :root { color-scheme: dark; --bg: #050608; --ink: #f4f5f7; --ink2: rgba(244,245,247,.7); --glass: rgba(255,255,255,.06); --hair: rgba(255,255,255,.1); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    main { max-width: 560px; margin: 0 auto; padding: max(env(safe-area-inset-top), 20px) 16px max(env(safe-area-inset-bottom), 24px); }
    h1 { font-size: 30px; margin: 18px 4px 2px; letter-spacing: -.02em; }
    .sub { color: var(--ink2); margin: 0 4px 16px; font-size: 13px; }
    .card { background: var(--glass); border: 1px solid var(--hair); border-radius: 22px; padding: 14px 16px; margin-bottom: 12px; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    p { margin: 6px 0 0; color: var(--ink2); font-size: 13px; overflow-wrap: anywhere; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; }
    .pass { background: #1f6f43; } .fail { background: #8a2b2b; } .info { background: #3a3f4b; } .wait { background: #3a3f4b; }
    button { margin: 10px 8px 0 0; padding: 9px 14px; border-radius: 99px; border: 0; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <main>
    <h1>Baseline POC</h1>
    <p class="sub">Feasibility checks · <span id="build"></span> · shows statuses and counts only</p>
    <div id="cards"></div>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
